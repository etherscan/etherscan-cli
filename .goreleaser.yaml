version: 2

project_name: etherscan

report_sizes: true

builds:
  - id: etherscan
    main: ./cmd/etherscan
    binary: etherscan
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - >-
        -s -w
        -X main.version={{ .Version }}
        -X main.commit={{ .Commit }}
        -X main.date={{ .CommitDate }}

archives:
  - id: etherscan
    ids:
      - etherscan
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc

release:
  prerelease: auto

brews:
  - name: etherscan
    ids:
      - etherscan
    repository:
      owner: etherscan
      name: homebrew-etherscan-cli
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/etherscan/etherscan-cli"
    description: "Command-line client and interactive explorer for the Etherscan V2 API"
    license: MIT
    install: |
      bin.install "etherscan"
    test: |
      system "#{bin}/etherscan", "version"
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_TOKEN" }}auto{{ else }}true{{ end }}'
