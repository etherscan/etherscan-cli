name: Test

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: go test ./...

      - name: Build CLI
        run: go build ./cmd/etherscan

      - name: Vulnerability scan
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  release-config:
    name: GoReleaser configuration
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.0
          install-only: true

      - name: Validate snapshot release
        run: goreleaser release --snapshot --clean --skip=publish

  npm-package:
    name: npm (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Runs on every matrix OS. The Windows leg is the one that matters: it packs
      # from a CRLF checkout, the combination no other job covered.
      - name: Verify packed tarball uses LF line endings
        run: npm run test:eol

      - name: Test npm package on macOS/Linux
        if: runner.os != 'Windows'
        run: sh ./scripts/test-npm.sh

      - name: Test npm package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-npm.ps1
